spring.application.name=ledgerly

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerly
spring.datasource.username=ledgerly
spring.datasource.password=ledgerly_dev_password

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

